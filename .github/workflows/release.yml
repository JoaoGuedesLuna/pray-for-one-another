name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate release version
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi

          PROJECT_VERSION=$(./mvnw --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version)

          if [[ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag version ($RELEASE_VERSION) does not match pom.xml version ($PROJECT_VERSION)"
            exit 1
          fi

          echo "Release version validated: $RELEASE_VERSION"

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate executable JAR
        shell: bash
        run: |
          JAR_FILE="target/pray-for-one-another-${GITHUB_REF_NAME#v}.jar"

          if [[ ! -f "$JAR_FILE" ]]; then
            echo "::error::Executable JAR not found: $JAR_FILE"
            exit 1
          fi

          echo "Executable JAR found: $JAR_FILE"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          JAR_FILE="target/pray-for-one-another-${VERSION#v}.jar"

          gh release create "$VERSION" "$JAR_FILE" --verify-tag --title "$VERSION" --generate-notes
